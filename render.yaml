# Render Blueprint: Stratos web app + Postgres (free tier)
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: stratos
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      # Free instances have 512 MB RAM; capping the heap keeps the Vite build
      # (~395 MB peak with this cap vs ~495 MB without) and the server under it
      - key: NODE_OPTIONS
        value: --max-old-space-size=320
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO_USER
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: stratos-db
          property: connectionString

databases:
  - name: stratos-db
    plan: free
    databaseName: stratos
    user: stratos
